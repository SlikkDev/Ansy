# A tag such as v1.0.0 builds the installers for all three systems, signs and
# notarizes the Mac ones when the Apple secrets are set, and attaches
# everything to a draft GitHub release for the owner to publish. The update
# files (latest*.yml, blockmaps) go with them, so installed copies find the
# new version. See docs/release.md for the whole procedure.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: End-to-end tests (Electron under Xvfb)
        run: xvfb-run -a npm run test:e2e
      - name: The tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

  release:
    name: Build and publish (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish for macOS, signed and notarized
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        env:
          HAS_APPLE: ${{ secrets.MAC_CERTIFICATE != '' }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --publish always

      - name: Publish for macOS, unsigned (no Apple secrets set)
        if: runner.os == 'macOS' && env.HAS_APPLE != 'true'
        env:
          HAS_APPLE: ${{ secrets.MAC_CERTIFICATE != '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always

      - name: Publish for Windows (the installer and the Store package)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPX_IDENTITY_NAME: ${{ secrets.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ secrets.APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          args=()
          if [ -n "$APPX_PUBLISHER" ]; then
            args+=("-c.appx.publisher=$APPX_PUBLISHER")
            args+=("-c.appx.identityName=$APPX_IDENTITY_NAME")
            args+=("-c.appx.publisherDisplayName=$APPX_PUBLISHER_DISPLAY_NAME")
          fi
          npx electron-builder --publish always "${args[@]}"

      - name: Publish for Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --publish always
