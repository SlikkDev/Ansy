# Installers. Unsigned until release 1.0 wires the Apple and Store identities.
appId: dev.slikk.ansy
productName: Ansy
copyright: Copyright © 2026 Slikk.Dev
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - resources/icon.png
  - package.json
  - '!**/*.map'
asar: true
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  darkModeSupport: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Ansy
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Slikk.Dev (https://github.com/SlikkDev/Ansy)
  synopsis: Experience your website the way people with disabilities do
  description: A free, open-source desktop browser that lets business owners experience their own website the way people with disabilities do, including the assistive tools those people use.
deb:
  recommends:
    - speech-dispatcher
publish:
  provider: github
  owner: SlikkDev
  repo: Ansy
